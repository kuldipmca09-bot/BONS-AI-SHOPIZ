#Spring boot configurations
#logging.config=log4j-shopizer.properties
server.port=8080


#Turn Statistics on
#spring.jpa.properties.hibernate.generate_statistics=true
#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER
#logging.level.org.hibernate.stat=debug

# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=INFO
#TRACE will print binding
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

#when running from IDE (eclipse) or from springboot:run command
#server.contextPath=/shopizer

logging.level.org.springframework=ERROR
logging.level.com.shopizer=INFO
logging.level.org.hibernate=ERROR
logging.level.org.apache.http=ERROR

#logging.file=shopizer.log

#Default Spring white label error page
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB


#hibernate 5
spring.jpa.hibernate.use-new-id-generator-mappings=true


#Spring boot 2.X
spring.main.allow-bean-definition-overriding: true

#build informations
application-description=@project.description@
application-version=@project.version@
build.timestamp=@maven.build.timestamp@

#actuator
management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.elasticsearch.enabled=false
management.health.mail.enabled=false
management.health.ping.enabled=true


##
## Oracle database configuration (default profile)
##
## These db.* / hibernate.* keys are the ones actually consumed by
## com.salesmanager.core.business.configuration.DataConfiguration.
## Override per environment via -Ddb.jdbcUrl=... etc. or an env-specific profile
## under sm-shop/src/main/resources/profiles/<profile>/database.properties.
##
## Oracle DB prerequisites (run once as a privileged user):
##   CREATE USER SALESMANAGER IDENTIFIED BY "very-long-shopizer-password";
##   GRANT CONNECT, RESOURCE TO SALESMANAGER;
##   ALTER USER SALESMANAGER QUOTA UNLIMITED ON USERS;
##
# db.jdbcUrl=jdbc:mysql://localhost:3306/shopizer  (former MySQL config, disabled)
db.jdbcUrl=jdbc:oracle:thin:@//localhost:1521/XEPDB1
db.user=SALESMANAGER
db.password=password
db.driverClass=oracle.jdbc.OracleDriver
hibernate.dialect=org.hibernate.dialect.Oracle12cDialect

db.show.sql=false
db.preferredTestQuery=SELECT 1 FROM DUAL
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update

##
## connection pool
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=15

# Keep Spring datasource keys aligned with the custom DataConfiguration values
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=update








