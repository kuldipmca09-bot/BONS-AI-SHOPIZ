#Spring boot configurations
#logging.config=log4j-shopizer.properties
server.port=8080


#Turn Statistics on
#spring.jpa.properties.hibernate.generate_statistics=true
#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER
#logging.level.org.hibernate.stat=debug

# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=INFO
#TRACE will print binding
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

#when running from IDE (eclipse) or from springboot:run command
#server.contextPath=/shopizer

logging.level.org.springframework=ERROR
logging.level.com.shopizer=INFO
logging.level.org.hibernate=ERROR
logging.level.org.apache.http=ERROR

#logging.file=shopizer.log

#Default Spring white label error page
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB


#hibernate 5
#Has no effect: DataConfiguration hard-codes hibernate.id.new_generator_mappings=false
#on the EntityManagerFactory it builds, and that is what wins. Left as-is so the
#TABLE id generators keep reading SM_SEQUENCER exactly as they did on MySQL --
#flipping it would change how allocationSize is interpreted and renumber ids.
spring.jpa.hibernate.use-new-id-generator-mappings=true


#Spring boot 2.X
spring.main.allow-bean-definition-overriding: true

#build informations
application-description=@project.description@
application-version=@project.version@
build.timestamp=@maven.build.timestamp@

#actuator
management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.elasticsearch.enabled=false
management.health.mail.enabled=false
management.health.ping.enabled=true


# Datasource / dialect configuration lives in database.properties, NOT here.
#
# DataConfiguration (sm-core .../configuration/DataConfiguration.java) builds the
# HikariDataSource and the EntityManagerFactory from unprefixed placeholders
# (db.jdbcUrl, db.user, db.password, db.driverClass, hibernate.dialect,
# hibernate.hbm2ddl.auto, db.schema, db.preferredTestQuery, db.*PoolSize).
# Those placeholders are resolved by the PropertyPlaceholderConfigurer declared
# per Spring profile in spring/shopizer-core-config.xml, which loads:
#   default -> classpath:database.properties
#   oracle  -> classpath:profiles/oracle/database.properties
#   local   -> classpath:profiles/local/database.properties
#   cloud   -> classpath:profiles/cloud/database.properties
#   gcp     -> classpath:profiles/gcp/database.properties
#   mysql   -> classpath:profiles/mysql/database.properties (deprecated name,
#              now points at Oracle so existing launch scripts keep working)
#
# Setting spring.datasource.* / spring.jpa.properties.hibernate.* here has NO
# effect, because DataConfiguration never reads those keys. Edit the relevant
# database.properties instead.








