
#Need to run these commands before running shopizer - choose your username and password
#Oracle (run as a privileged user, e.g. SYS/SYSTEM):
#  CREATE USER SALESMANAGER IDENTIFIED BY "very-long-shopizer-password";
#  GRANT CONNECT, RESOURCE TO SALESMANAGER;
#  ALTER USER SALESMANAGER QUOTA UNLIMITED ON USERS;

#ORACLE
db.jdbcUrl=jdbc:oracle:thin:@//<HOST>:1521/XEPDB1
db.user=SALESMANAGER
db.password=<YOUR PASSWORD>
db.driverClass=oracle.jdbc.OracleDriver
hibernate.dialect=org.hibernate.dialect.Oracle12cDialect


db.show.sql=true
db.preferredTestQuery=SELECT 1 FROM DUAL
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update



##
## db pool config
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=8