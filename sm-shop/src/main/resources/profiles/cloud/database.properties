#ORACLE
#when connecting to docker compose from outside docker
#db.jdbcUrl=jdbc:oracle:thin:@//0.0.0.0:1521/XEPDB1

#db.jdbcUrl=jdbc:oracle:thin:@//shopizer-db:1521/XEPDB1
#db.user=SALESMANAGER
